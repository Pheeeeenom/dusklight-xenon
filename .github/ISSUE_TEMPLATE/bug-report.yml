name: Problem Report
description: Report a problem with Dusklight on the Xbox 360
type: Bug
body:
- type: textarea
  id: problem
  attributes:
    label: "Problem:"
    description: What went wrong, and where in the game.
  validations:
    required: true

- type: textarea
  id: reproducibility
  attributes:
    label: "Reproducibility:"
    description: Does it happen every time? If you can, the steps that make it happen.
  validations:
    required: true

- type: upload
  id: log-file
  attributes:
    label: "If it crashed or froze, share dusklight.log:"
    description: >-
      dusklight.log is in the folder with dusklight.xex. Each start of the game replaces it, so copy it before you start
      the game again, then add it here.

- type: upload
  id: save-file
  attributes:
    label: "If possible, share your save file:"
    description: >-
      The save is the .gci file in TwilitRealm\Dusklight\USA\Card A\, in the folder with dusklight.xex. Zip it and add
      the zip here.
